name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Branch protection on main requires this job name. Renaming it silently
  # removes the required check rather than failing it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      # Invoked directly rather than through `composer test:coverage`: Composer's
      # script runner can resolve a different php than the one carrying pcov,
      # which surfaces as "No code coverage driver available".
      - name: Run PHP tests with coverage
        run: php -d pcov.directory=. vendor/bin/phpunit --coverage-clover coverage/clover.xml

      - name: Enforce coverage threshold
        run: php bin/coverage-check.php 50

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Run JS tests
        run: npm run test:unit

      - name: Build
        run: npm run build

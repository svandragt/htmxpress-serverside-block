name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependabot can rebase a PR onto a newer release, turning a minor update
      # into a major one. Auto-merge enabled on the earlier revision survives
      # that, so the step above is not enough on its own: withdraw it whenever
      # the current head is a major. @wordpress/scripts 34.1.0 -> 35.0.0 reached
      # main this way.
      - name: Withdraw auto-merge from majors
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        # Exits non-zero when auto-merge was never enabled, which is the common
        # case for a PR that opened as a major. Nothing to undo, so don't fail.
        run: gh pr merge --disable-auto "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
